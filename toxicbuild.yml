# CI confs for toxicbuild

language: python

versions:
  - '3.12'
  - '3.13'

extra_indexes:
  - 'https://pypi.poraodojuca.dev'

branches:
  - master
  - bug-*
  - feature-*
  - refactor-*

system_packages:
  - make
  - git
  - curl

steps:
  - name: Linter checks
    command: ./scripts/run_linter.sh

  - name: Build docs
    command: ./build-scripts/build_docs.sh


builders:

  - name: Docs & Release
    branches:
      - release

    platform: python3.13

    envvars:
      ENV: ci

    plugins:
      - name: apt-install
        packages:
          - build-essential
          - curl

      - name: python-venv
        pyversion: python3.13
        extra_indexes:
          - 'https://pypi.poraodojuca.dev'

    steps:
      - name: Build docs
        command: ./build-scripts/build_docs.sh
        stop_on_fail: true

      - name: Build package
        command: ./scripts/release.sh
        stop_on_fail: true

      - name: Upload docs
        command: ./scripts/upload_docs.sh
